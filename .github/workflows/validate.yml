name: validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  workspace-operation-contracts:
    name: Workspace Operation contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: python3 -m pip install --upgrade pip jsonschema

      - name: Validate contract examples
        run: make validate
